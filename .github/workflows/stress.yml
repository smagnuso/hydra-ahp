name: stress

# Runs the integration suites repeatedly on every platform to find the tests that fail only sometimes, keeping the
# scratch daemons' logs from each failing round.
on:
  push:
    branches: ["stress/**"]
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds of the integration suites per platform
        default: "8"

jobs:
  stress:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    env:
      HYDRA_CLI_DIST: ${{ github.workspace }}/hydra-cli/dist/daemon.js
    steps:
      - uses: actions/checkout@v4
        with:
          path: ahp
      - uses: actions/checkout@v4
        with:
          repository: smagnuso/hydra-acp
          path: hydra-cli
      # See ci.yml: the daemon checkout floats, so a failing round has to name the
      # daemon it ran against.
      - name: Record the revisions under test
        shell: bash
        run: |
          daemon=$(git -C hydra-cli rev-parse HEAD)
          subject=$(git -C hydra-cli log -1 --pretty=%s)
          committed=$(git -C hydra-cli log -1 --date=iso-strict --pretty=%cd)
          {
            echo "ahp    ${{ github.sha }}"
            echo "daemon $daemon ($committed) $subject"
          } | tee revisions.txt
          {
            echo "| | revision | |"
            echo "| --- | --- | --- |"
            echo "| ahp | \`${{ github.sha }}\` | |"
            echo "| daemon | \`$daemon\` | $committed — $subject |"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p stress
          mv revisions.txt stress/revisions.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            ahp/package-lock.json
            hydra-cli/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci && npm run build
        working-directory: hydra-cli
      - run: npm ci && npm run build
        working-directory: ahp
      - name: Run the integration suites repeatedly
        shell: bash
        working-directory: ahp
        run: |
          mkdir -p ../stress
          failed=0
          for round in $(seq 1 "${{ inputs.rounds || 8 }}"); do
            logs="$GITHUB_WORKSPACE/stress/round-$round"
            if HYDRA_AHP_TEST_LOG_DIR="$logs" npx vitest run test/integration > "../stress/round-$round.txt" 2>&1; then
              rm -rf "$logs" "../stress/round-$round.txt"
            else
              failed=$((failed + 1))
              echo "round $round failed:"
              sed 's/\x1b\[[0-9;]*m//g' "../stress/round-$round.txt" | grep -E ' FAIL ' | sort -u
            fi
          done
          echo "$failed of ${{ inputs.rounds || 8 }} rounds failed"
          test "$failed" -eq 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-${{ matrix.os }}-node${{ matrix.node }}
          path: stress
          if-no-files-found: ignore
