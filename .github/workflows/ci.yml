name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    env:
      HYDRA_CLI_DIST: ${{ github.workspace }}/hydra-cli/dist/daemon.js
      HYDRA_AHP_TEST_LOG_DIR: ${{ github.workspace }}/test-logs
    steps:
      - uses: actions/checkout@v4
        with:
          path: ahp
      # The integration tests run the extension under scratch daemons built from Hydra's own repo.
      - uses: actions/checkout@v4
        with:
          repository: smagnuso/hydra-acp
          path: hydra-cli
      # The daemon checkout floats on Hydra's master, so a red run needs the pair of
      # revisions to be attributable: an ahp bug, a daemon bug, and a daemon fix that
      # is committed but not yet pushed all look the same without it.
      - name: Record the revisions under test
        shell: bash
        run: |
          daemon=$(git -C hydra-cli rev-parse HEAD)
          subject=$(git -C hydra-cli log -1 --pretty=%s)
          committed=$(git -C hydra-cli log -1 --date=iso-strict --pretty=%cd)
          {
            echo "ahp    ${{ github.sha }}"
            echo "daemon $daemon ($committed) $subject"
          } | tee revisions.txt
          {
            echo "| | revision | |"
            echo "| --- | --- | --- |"
            echo "| ahp | \`${{ github.sha }}\` | |"
            echo "| daemon | \`$daemon\` | $committed — $subject |"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p test-logs
          mv revisions.txt test-logs/revisions.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            ahp/package-lock.json
            hydra-cli/package-lock.json
      # The npm bundled with Node 20 and 22 can die in npm ci with "Exit handler never called!"; npm 11 does not.
      - run: npm install -g npm@11
      - run: npm ci && npm run build
        working-directory: hydra-cli
      - run: npm ci
        working-directory: ahp
      - run: npm run lint
        working-directory: ahp
      - run: npm run build
        working-directory: ahp
      - run: npm test
        working-directory: ahp
      # The scratch daemons' own logs (daemon, extension, agents), which is where an integration failure is explained.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-node${{ matrix.node }}
          path: test-logs
          if-no-files-found: ignore

  # The single check the branch ruleset requires; do not rename it.
  all-checks:
    name: all-checks
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Require every matrix leg to have passed
        if: needs.test.result != 'success'
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          exit 1
      - run: echo "all matrix legs passed"
