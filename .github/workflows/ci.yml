name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # No Windows: terminals and the test harness assume a POSIX shell.
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    env:
      HYDRA_CLI_DIST: ${{ github.workspace }}/hydra-cli/dist/daemon.js
    steps:
      - uses: actions/checkout@v4
        with:
          path: ahp
      # The integration tests run the extension under scratch daemons built from Hydra's own repo.
      - uses: actions/checkout@v4
        with:
          repository: smagnuso/hydra-acp
          path: hydra-cli
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            ahp/package-lock.json
            hydra-cli/package-lock.json
      # The npm bundled with Node 20 and 22 can die in npm ci with "Exit handler never called!"; npm 11 does not.
      - run: npm install -g npm@11
      - run: npm ci && npm run build
        working-directory: hydra-cli
      - run: npm ci
        working-directory: ahp
      - run: npm run lint
        working-directory: ahp
      - run: npm run build
        working-directory: ahp
      - run: npm test
        working-directory: ahp

  # The single check the branch ruleset requires; do not rename it.
  all-checks:
    name: all-checks
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Require every matrix leg to have passed
        if: needs.test.result != 'success'
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          exit 1
      - run: echo "all matrix legs passed"
